services:
  apps-bn:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-apps-bn-static:latest}
    container_name: ${CONTAINER_NAME:-apps-bn}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3001}
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-apps-bn}.rule=Host(`${ORIGIN}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-apps-bn}.entrypoints=websecure"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-apps-bn}.tls.certresolver=myresolver"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-apps-bn}.priority=1"
      - "traefik.http.services.${TRAEFIK_ROUTER_NAME:-apps-bn}.loadbalancer.server.port=${PORT:-3001}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${PORT:-3001}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  proxy:
    external: true
